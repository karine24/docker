version: "3.9"

services:
  app:
    image: karinetavares/docker-demo-1:1.0
    container_name: nest-docker
    ports:
      - "3000:3000"
    environment:
      - DB_TYPE=postgres
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DB=postgres
      - PG_PORT=5432
      - PG_HOST=db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - backend
    volumes:
      - ./src:/app/src

  redis:
    image: redis
    networks:
      - backend
    ports:
      - 6379:6379

  db:
    container_name: db
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}

networks:
  backend:
    driver: "bridge"
